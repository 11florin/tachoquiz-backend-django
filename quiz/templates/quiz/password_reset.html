{% extends "tachoquiz/base.html" %}
{% load i18n %}

{% block title %}
  {% translate "Reset Password" %} | Tacho Quiz
{% endblock %}

{% block content %}
<section class="login-section">
    <div class="screen-header">
        <h1>{% translate "Reset Password" %}</h1>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="login-body">
            <div class="form-group">
                <label for="{{ form.email.id_for_label }}">
                    {% translate "Email" %}
                </label>

                {{ form.email }}

                {% if form.email.errors %}
                    {{ form.email.errors }}
                {% endif %}
            </div>

            <button type="submit" class="action-btn form-group">
                {% translate "SEND RESET LINK" %}
            </button>
        </div>
    </form>
</section>
{% endblock %}
