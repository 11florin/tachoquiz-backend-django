{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TachoQuiz</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'quiz/css/style.css' %}" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header>
      <div class="navbar" id="navbar">
        <a href="{% url 'home' %}" class="nav-logo">
          Tacho <span>Quiz</span>
        </a>

        <button
          class="hamburger"
          id="hamburger"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav id="nav-menu" aria-label="Main navigation">
          <ul>
            {% if user.is_authenticated %}
            <li><a href="{% url 'logout' %}">Logout</a></li>
            {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
            {% endif %}

            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="#">Quiz</a></li>
            <li><a href="#">Score</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="#">About</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main>{% block content %} {% endblock %}</main>

    <!-- IMAGE FOOTER -->
    <div class="image-container">
      <img
        src="{% static 'quiz/images/truck-img2.png' %}"
        alt="Illustration of a truck"
      />
    </div>

    <!-- JS -->
    <script src="{% static 'quiz/js/navbar.js' %}" defer></script>
  </body>
</html>
